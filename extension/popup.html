<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBase Uploader Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>KBase Uploader <span class="badge">PRO</span></h1>
      <p>Automated FTP Import Engine</p>
    </header>

    <main>
      <div class="card glass">
        <label for="csvFile" class="file-label">
          <span class="icon">📁</span>
          <span class="text">Load CSV Data</span>
          <input type="file" id="csvFile" accept=".csv" hidden>
        </label>
        <div id="fileInfo" class="hidden">
           <p id="fileName"></p>
           <p id="rowCount"></p>
        </div>
      </div>

      <div class="stats card glass hidden" id="statusCard">
        <div class="progress-bar">
          <div id="progressBarFill" style="width: 0%;"></div>
        </div>
        <div class="stats-row">
          <div class="stat-item">
            <span class="label">Completed</span>
            <span class="value" id="doneCount">0</span>
          </div>
          <div class="stat-item">
            <span class="label">Remaining</span>
            <span class="value" id="todoCount">0</span>
          </div>
        </div>
      </div>

      <div class="log-area card glass hidden" id="logCard">
        <h3>System Log</h3>
        <div id="logContent" class="log-inner"></div>
      </div>
    </main>

    <footer>
      <button id="startBtn" class="btn btn-primary" disabled>Start Automation</button>
      <button id="stopBtn" class="btn btn-secondary hidden">Stop</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
